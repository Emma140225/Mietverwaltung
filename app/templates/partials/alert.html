{% if success_message %}
<div class="mb-4 rounded-lg border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm text-emerald-800 dark:border-emerald-800/70 dark:bg-emerald-950/60 dark:text-emerald-200">
    {{ success_message }}
</div>
{% endif %}
{% if error_message %}
<div class="mb-4 rounded-lg border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-800 dark:border-rose-800/70 dark:bg-rose-950/60 dark:text-rose-200">
    {{ error_message }}
</div>
{% endif %}
