[project]
name = "mietverwaltung"
version = "0.1.0"
description = "Lokale Web-Anwendung zur privaten Hausverwaltung von Wohneinheiten"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
